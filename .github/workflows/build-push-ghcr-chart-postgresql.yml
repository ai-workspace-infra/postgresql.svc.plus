name: Build And Push GHCR Chart PostgreSQL

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - "deploy/helm/postgresql/**"
      - ".github/workflows/build-push-ghcr-chart-postgresql.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: build-push-ghcr-chart-postgresql-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OCI_NAMESPACE: x-evor/charts
  CHART_DIR: deploy/helm/postgresql

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Validate Helm Is Available
        run: helm version

      - name: Package And Push Chart
        run: .github/scripts/utils/package-push-chart.sh
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
