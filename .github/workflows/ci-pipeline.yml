name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*", "daily-build-*" ]
  workflow_dispatch:
    inputs:
      deployment_environment:
        description: Deployment environment for Vault and downstream release metadata.
        required: false
        default: "uat"
        type: choice
        options:
          - sit
          - uat
          - prod
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false
        type: string
      push_latest:
        description: Also publish the `latest` tag.
        required: false
        default: false
        type: boolean
      pg_version:
        description: PostgreSQL version to build.
        required: false
        default: "17.0"
        type: string
  workflow_call:
    inputs:
      deployment_environment:
        description: Deployment environment for Vault and downstream release metadata.
        required: false
        default: "uat"
        type: string
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false
        type: string
      push_latest:
        description: Also publish the `latest` tag.
        required: false
        default: false
        type: boolean
      pg_version:
        description: PostgreSQL version to build.
        required: false
        default: "17.0"
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      # 不声明这一行, 下游的 needs.prep.outputs.push_latest 会解析成空字符串
      # 而不是报错, metadata-action 收到 enable= 就报 "Invalid value for
      # enable attribute" —— 错误出现在消费端, 与真正缺失的地方隔着一个 job。
      push_latest: ${{ steps.env.outputs.push_latest }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Resolve Environment
        id: env
        # $3 只在 workflow_dispatch/workflow_call 触发时展开成 true/false;
        # push/pull_request 下 inputs 这个 context 不存在, 展开为空字符串 ——
        # 脚本内部按 EVENT_NAME 分支消解这个歧义。
        run: .github/scripts/utils/resolve-env.sh "" "" "${{ inputs.deployment_environment }}" "${{ inputs.push_latest }}"

  build-and-push-images:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-push-ghcr-image-stunnel-server
            image_name: stunnel-server
            dockerfile: deploy/base-images/stunnel-server.Dockerfile
            context: deploy/base-images
            build_args: ""
          - name: build-push-ghcr-image-stunnel-client
            image_name: stunnel-client
            dockerfile: deploy/base-images/stunnel-client.Dockerfile
            context: deploy/base-images
            build_args: ""
          - name: build-push-ghcr-image-postgresql
            image_name: postgresql
            dockerfile: deploy/base-images/postgres-runtime-wth-extensions.Dockerfile
            context: deploy/base-images
            build_args: |
              PG_MAJOR=17
              PG_VERSION=${{ inputs.pg_version || '17.0' }}
              PG_JIEBA_VERSION=v2.0.1
              PG_VECTOR_VERSION=v0.8.1
              PGMQ_VERSION=v1.8.0
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Vault Authentication
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          role: github-actions-postgresql-${{ needs.prep.outputs.environment }}
          jwtGithubAudience: vault
          method: jwt
          secrets: |
            kv/data/CICD GHCR_USERNAME | GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Log In To GHCR
        uses: docker/login-action@bb555fc48dca4deb5f227b07c7304c673b5708f0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ steps.vault.outputs.GHCR_USERNAME }}
          password: ${{ steps.vault.outputs.GHCR_TOKEN }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          # 用调用方仓库的实际 owner, 不写死 org 名 —— 与本仓其余四个
          # 业务仓的做法一致(accounts/billing-service/docs 都是从
          # github.repository 动态取, 不会跟仓库实际所在 org 脱节)。
          # 这里原来硬编码 x-evor/images/<name>, 是这个仓库改名/迁移到
          # ai-workspace-infra 之前留下的旧路径, 从没跟着更新过 ——
          # gitops 仓的 compose .env 按当前仓库 owner 拼地址, 拼出来的
          # ghcr.io/ai-workspace-infra/postgresql.svc.plus 从来没被这里
          # 发布过, web-saas 整个 stack 因此拉不到镜像却不报任何错
          # (compose 合法、CI 全绿、只有 Doco-CD 在主机上静默重试)。
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ github.ref_name }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=sha,format=long,enable=${{ inputs.image_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.push_latest == true }}

      - name: Build And Push Image
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  build-and-push-chart:
    needs: [prep, build-and-push-images]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      # 与镜像同理: 不写死历史 org 名, 跟着实际仓库 owner 走。
      # ghcr.io/x-evor/charts/postgresql 在 GHCR 上从未真正发布过
      # (docker manifest inspect 确认 ABSENT) —— 这条路径本来就是死的。
      OCI_NAMESPACE: ${{ github.repository_owner }}/charts
      CHART_DIR: deploy/helm/postgresql
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Vault Authentication
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          role: github-actions-postgresql-${{ needs.prep.outputs.environment }}
          jwtGithubAudience: vault
          method: jwt
          secrets: |
            kv/data/CICD GHCR_USERNAME | GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Validate Helm Is Available
        run: helm version

      - name: Package And Push Chart
        run: .github/scripts/utils/package-push-chart.sh
        env:
          GHCR_TOKEN: ${{ steps.vault.outputs.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ steps.vault.outputs.GHCR_USERNAME }}

  release:
    name: Publish release manifest and assets
    needs: [build-and-push-images, build-and-push-chart]
    if: ${{ startsWith(github.ref, 'refs/tags/daily-build-') && needs.build-and-push-images.result == 'success' && needs.build-and-push-chart.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Prepare release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_REFS: |
            ghcr.io/${{ github.repository_owner }}/stunnel-server:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/stunnel-client:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/postgresql:${{ github.ref_name }}
          CHART_DIR: deploy/helm/postgresql
          CHART_REFS: oci://ghcr.io/${{ github.repository_owner }}/charts/postgresql
          CHART_VERSION: 0.0.0-${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/publish-release-artifacts.sh
