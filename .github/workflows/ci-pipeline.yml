name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false
        type: string
      push_latest:
        description: Also publish the `latest` tag.
        required: false
        default: false
        type: boolean
      pg_version:
        description: PostgreSQL version to build.
        required: false
        default: "17.0"
        type: string
  workflow_call:
    inputs:
      image_tag:
        description: Optional image tag. Defaults to the current commit SHA.
        required: false
        type: string
      push_latest:
        description: Also publish the `latest` tag.
        required: false
        default: false
        type: boolean
      pg_version:
        description: PostgreSQL version to build.
        required: false
        default: "17.0"
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: ci-pipeline-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  prep:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      # 不声明这一行, 下游的 needs.prep.outputs.push_latest 会解析成空字符串
      # 而不是报错, metadata-action 收到 enable= 就报 "Invalid value for
      # enable attribute" —— 错误出现在消费端, 与真正缺失的地方隔着一个 job。
      push_latest: ${{ steps.env.outputs.push_latest }}
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Resolve Environment
        id: env
        # $3 只在 workflow_dispatch/workflow_call 触发时展开成 true/false;
        # push/pull_request 下 inputs 这个 context 不存在, 展开为空字符串 ——
        # 脚本内部按 EVENT_NAME 分支消解这个歧义。
        run: .github/scripts/utils/resolve-env.sh "" "" "${{ inputs.push_latest }}"

  build-and-push-images:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-push-ghcr-image-stunnel-server
            image_name: x-evor/images/stunnel-server
            dockerfile: deploy/base-images/stunnel-server.Dockerfile
            context: deploy/base-images
            build_args: ""
          - name: build-push-ghcr-image-stunnel-client
            image_name: x-evor/images/stunnel-client
            dockerfile: deploy/base-images/stunnel-client.Dockerfile
            context: deploy/base-images
            build_args: ""
          - name: build-push-ghcr-image-postgresql
            image_name: x-evor/images/postgresql
            dockerfile: deploy/base-images/postgres-runtime-wth-extensions.Dockerfile
            context: deploy/base-images
            build_args: |
              PG_MAJOR=17
              PG_VERSION=${{ inputs.pg_version || '17.0' }}
              PG_JIEBA_VERSION=v2.0.1
              PG_VECTOR_VERSION=v0.8.1
              PGMQ_VERSION=v1.8.0
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Vault Authentication
        uses: hashicorp/vault-action@v4
        continue-on-error: true
        with:
          url: https://vault.svc.plus
          role: github-actions-postgresql-${{ needs.prep.outputs.environment }}
          jwtGithubAudience: vault
          method: jwt
          secrets: |
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@21162887f0d6e25b4e8eafb0cf44cf9bf7f6acd3

      - name: Log In To GHCR
        uses: docker/login-action@bb555fc48dca4deb5f227b07c7304c673b5708f0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ vars.GHCR_USERNAME || github.repository_owner }}
          password: ${{ env.GHCR_TOKEN || secrets.GHCR_TOKEN || github.token }}

      - name: Compute Image Tags
        id: meta
        uses: docker/metadata-action@c3b064c6d7c32446d6bc214ea075f1caad2de35a
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image_name }}
          tags: |
            type=raw,value=${{ inputs.image_tag }},enable=${{ inputs.image_tag != '' }}
            type=sha,format=long,enable=${{ inputs.image_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.push_latest == true }}

      - name: Build And Push Image
        uses: docker/build-push-action@83bfd93ab480705a7b99a2ed02765137f5ab55ba
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}

  build-and-push-chart:
    needs: [prep, build-and-push-images]
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      OCI_NAMESPACE: x-evor/charts
      CHART_DIR: deploy/helm/postgresql
    steps:
      - name: Check Out Repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Vault Authentication
        uses: hashicorp/vault-action@v4
        continue-on-error: true
        with:
          url: https://vault.svc.plus
          role: github-actions-postgresql-${{ needs.prep.outputs.environment }}
          jwtGithubAudience: vault
          method: jwt
          secrets: |
            kv/data/CICD GHCR_TOKEN | GHCR_TOKEN ;

      - name: Validate Helm Is Available
        run: helm version

      - name: Package And Push Chart
        run: .github/scripts/utils/package-push-chart.sh
        env:
          GHCR_TOKEN: ${{ env.GHCR_TOKEN || secrets.GHCR_TOKEN || github.token }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME || github.repository_owner }}
